name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-build.txt
      - run: pnpm --dir services/lux install --frozen-lockfile
      - run: pnpm --dir services/netgear install --frozen-lockfile
      - run: python -m unittest discover -s services/dsan -p "test_*.py"
      - run: node --test tests/*.test.cjs services/lux/tests/fetch-signal-snapshot.test.mjs services/ultrix/test/*.test.js
      - run: go -C services/power test ./...
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - run: node scripts/smoke-bundle.cjs "dist/windows/Tech Hub/resources"
      - run: ./scripts/test-windows-host.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Tech-Hub-Windows-x64-*.exe*
            dist/Tech-Hub-All-Apps-win32-x64.zip
            dist/catalog-win32-x64.json
            dist/app-packages-win32-x64/*.zip
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-build.txt
      - run: pnpm --dir services/lux install --frozen-lockfile
      - run: pnpm --dir services/netgear install --frozen-lockfile
      - run: python -m unittest discover -s services/dsan -p "test_*.py"
      - run: node --test tests/*.test.cjs services/lux/tests/fetch-signal-snapshot.test.mjs services/ultrix/test/*.test.js
      - run: go -C services/power test ./...
      - run: bash scripts/build-mac.sh
      - run: node scripts/smoke-bundle.cjs "dist/Tech Hub.app/Contents/Resources"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/Tech-Hub-macOS-arm64*.dmg*
            dist/Tech-Hub-All-Apps-darwin-arm64.zip
            dist/catalog-darwin-arm64.json
            dist/app-packages-darwin-arm64/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Prepare catalog and SDK
        run: |
          find installers -mindepth 2 -type f -name '*.zip' -exec mv {} installers/ \;
          find installers -mindepth 1 -type d -empty -delete
          node scripts/release-catalog.cjs installers
      - name: Publish installers together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/techhub-release-draft; then
            test "$(cat /tmp/techhub-release-draft)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --draft --title "Tech Hub ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "Tech Hub ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
