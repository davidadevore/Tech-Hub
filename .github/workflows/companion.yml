name: Build Companion module
on:
  push:
    branches: [main]
    paths:
      - 'companion-module-streamline-techhub/**'
      - '.github/workflows/companion.yml'
    tags: ['companion-v*']
  pull_request:
    paths:
      - 'companion-module-streamline-techhub/**'
      - '.github/workflows/companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-module-streamline-techhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm package
      - run: pnpm smoke
      - run: sha256sum streamline-techhub-*.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: companion-module
          path: |
            companion-module-streamline-techhub/streamline-techhub-*.tgz
            companion-module-streamline-techhub/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-module
          path: module-package
      - name: Publish offline Companion package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./companion-module-streamline-techhub/package.json').version")
          test "$GITHUB_REF_NAME" = "companion-v$version"
          gh release create "$GITHUB_REF_NAME" module-package/* --title "Tech Hub Companion module $version" --notes-file companion-module-streamline-techhub/companion/HELP.md --latest=false --verify-tag
